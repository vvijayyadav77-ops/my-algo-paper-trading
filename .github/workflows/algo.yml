name: Algo Paper Trading

on:
schedule:
- cron: "*/5 3-10 * * 1-5"
workflow_dispatch:

permissions:
contents: write

concurrency:
group: paper-trading
cancel-in-progress: false

jobs:
trading:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v5
    with:
      fetch-depth: 0

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.11"

  - name: Install Libraries
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Run Algo
    run: python paper_trading.py

  - name: Save Trading Data
    run: |
      git config user.name "Algo Bot"
      git config user.email "algo-bot@users.noreply.github.com"
      git add paper_state.json
      if ! git diff --cached --quiet; then
        git commit -m "Update paper trading data"
        git push
      else
        echo "No changes to save"
      fi
