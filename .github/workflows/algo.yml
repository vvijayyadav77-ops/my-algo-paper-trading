name: Algo Trading Workflow

on:
  workflow_dispatch:

# Git push karne ke liye write permission zaroori hai
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Code ko runner par checkout karna zaroori hai
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python setup karna
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. Libraries install karna
      - name: Install Libraries
        run: pip install yfinance pandas

      # 4. Main script run karna
      - name: Run Algo Trading
        run: python paper_trading.py

      # 5. Data save karke push karna
      - name: Save Trading Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          git commit -m "Update paper trading data" || echo "No changes"
          git push
