name: Paper Trading Bot

on:
  schedule:
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

# Ye ensure karega ki ek time par sirf ek hi run chale aur git conflict na ho
concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas

      - name: Check Python File
        run: |
          echo "CHECKING PYTHON FILE"
          pwd
          ls -l
          head -n 10 paper_trading.py

      - name: Run Algo
        run: |
          echo "STARTING PAPER TRADING"
          python paper_trading.py

      - name: Save Trading Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check karo ki file exist karti hai ya nahi
          if [ -f paper_state.json ]; then
            git add paper_state.json

            # Check karo ki koi changes huye hain ya nahi
            if ! git diff --cached --quiet; then
              git commit -m "Update paper trading data"
              git pull --rebase origin main
              git push origin HEAD:main
            else
              echo "No changes to save"
            fi 
          else
            echo "paper_state.json not found. Skipping git push."
          fi