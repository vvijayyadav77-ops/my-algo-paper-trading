name: Algo Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-9 * * 1-5'

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install yfinance pandas

      - name: Check Python File
        run: |
          echo "CHECKING PYTHON FILE"
          pwd
          ls -l
          head -n 10 paper_trading.py

      - name: Run Algo
        run: |
          echo "STARTING PAPER TRADING"
          python paper_trading.py

      - name: Save Trading Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_state.json
          git commit -m "Update paper trading data" || echo "No changes"
          git push
