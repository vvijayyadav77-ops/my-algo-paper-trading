name: Paper Trading Bot

on:
  workflow_dispatch: # Ya phir aapka schedule (cron)
  # schedule:
  #   - cron: '*/15 * * * *'

# SABSE ZAROORI: Push karne ke liye write permission dena
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas

      - name: Check Python File
        run: |
          echo "CHECKING PYTHON FILE"
          pwd
          ls -l
          head -n 10 paper_trading.py

      - name: Run Algo
        run: |
          echo "STARTING PAPER TRADING"
          python paper_trading.py

      - name: Save Trading Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check karo ki file bani hai ya nahi
          if [ -f paper_state.json ]; then
            git add paper_state.json
            git commit -m "Update paper trading data" || echo "No changes to commit"
            
            # Push se pehle pull karo taaki conflict na aaye
            git pull --rebase origin main || echo "Pull failed or no changes"
            git push
          else
            echo "paper_state.json not found. Skipping git push."
          fi