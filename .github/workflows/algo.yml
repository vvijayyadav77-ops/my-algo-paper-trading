name: Paper Trading Bot

on:
  schedule:
    # 9:15 AM IST
    - cron: '45 3 * * 1-5'

    # 3:00 PM IST
    - cron: '30 9 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas

      - name: Run Bot and Publish Every Minute
        shell: bash
        run: |
          python -u paper_trading.py &
          BOT_PID=$!

          while kill -0 "$BOT_PID" 2>/dev/null; do
            sleep 60

            git add paper_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Live paper trading update"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          done

          wait "$BOT_PID"

      - name: Final Save
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Final paper trading update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi