name: Paper Trading Bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas

      - name: Run Continuous Algo
        run: |
          python paper_trading.py

      - name: Save Trading Data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f paper_state.json ]; then
            echo "paper_state.json not found — nothing to save"
            exit 0
          fi

          git add paper_state.json

          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi

          git commit -m "Update paper trading data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main