name: Algo Paper Trading

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Algo
        run: python paper_trading.py

      - name: Save Trading Data
        run: |
          git config user.name "Algo Bot"
          git config user.email "algo-bot@users.noreply.github.com"
          git add paper_state.json
          git diff --cached --quiet || git commit -m "Update paper trading data"
          git push
